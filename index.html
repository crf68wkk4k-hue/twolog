<!doctype html>
<html lang="ko" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>투로그 — 우리의 기록</title>
<meta name="description" content="투로그(TwoLog) · 둘이 함께 쌓는 캘린더, 노트, 사진첩.">

<!-- 색 -->
<meta name="theme-color" content="#FFFFFF" id="metaTheme">
<meta name="color-scheme" content="light">

<!-- iOS 홈 화면에 추가 (standalone) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="투로그">
<meta name="application-name" content="투로그">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="mask-icon" href="icons/favicon.svg" color="#1C1C1E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="phone" id="phone">
  <div class="statusbar">
    <span id="clock">9:41</span>
    <div class="island"></div>
    <span class="sb-right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="0"/><rect x="4.5" y="5" width="3" height="6" rx="0"/><rect x="9" y="2.5" width="3" height="8.5" rx="0"/><rect x="13.5" y="0" width="3" height="11" rx="0"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.4 5.6 7.9a3.4 3.4 0 0 1 4.8 0zM3.4 5.7 1.8 4a9 9 0 0 1 12.4 0l-1.6 1.7a6.7 6.7 0 0 0-9.2 0z"/><circle cx="8" cy="10" r="1.1"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.6" y="0.6" width="20" height="10.8" rx="0" stroke="currentColor" stroke-opacity=".35" stroke-width="1.1"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="0" fill="currentColor"/><path d="M22.4 4.2v3.6c1-.3 1.5-.9 1.5-1.8s-.5-1.5-1.5-1.8z" fill="currentColor" fill-opacity=".4"/></svg>
    </span>
  </div>

  <main class="screens" id="screens">
    <section class="screen active" id="s-home"></section>
    <section class="screen" id="s-cal"></section>
    <section class="screen" id="s-diary"></section>
    <section class="screen" id="s-photo"></section>
    <section class="screen" id="s-set"></section>
    <section class="screen" id="s-login"></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="주요 화면"></nav>

  <div class="sheet-wrap" id="sheetWrap" aria-hidden="true">
    <div class="backdrop" data-close="1"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 프로필 사진: 실제 파일 선택 -->
  <input id="avatarInput" type="file" accept="image/*" hidden>
  <input id="photoInput" type="file" accept="image/*" multiple hidden>
</div>

<noscript>
  <div style="padding:24px;font-family:-apple-system,sans-serif">투로그를 쓰려면 자바스크립트를 켜 주세요.</div>
</noscript>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
